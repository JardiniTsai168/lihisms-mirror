<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff5f8">
  <title>申請已送出｜lihiSMS</title>
  <link rel="icon" href="assets/images/favicon-32x32.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="flow-header">
    <div class="flow-header__inner">
      <a class="flow-logo" href="./" aria-label="回到 lihiSMS 首頁"><img src="assets/images/lihisms-logo.png" alt="lihiSMS"></a>
      <a class="header-help" href="https://lihistatus.com/contact">需要協助？聯絡我們</a>
    </div>
  </header>

  <main class="flow-main" id="main">
    <nav class="progress" aria-label="申請進度">
      <ol class="progress__list">
        <li class="progress__item is-complete"><span class="progress__dot">✓</span><span class="progress__label">建立帳號</span></li>
        <li class="progress__item is-complete"><span class="progress__dot">✓</span><span class="progress__label">實名驗證</span></li>
        <li class="progress__item is-complete"><span class="progress__dot">✓</span><span class="progress__label">白名單網域</span></li>
        <li class="progress__item is-current" aria-current="step"><span class="progress__dot">✓</span><span class="progress__label">完成申請</span></li>
      </ol>
    </nav>

    <section class="success-panel" aria-labelledby="success-title">
      <div class="success-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div class="eyebrow">APPLICATION SENT</div>
      <h1 id="success-title">申請已成功送出</h1>
      <p>我們會檢查實名與白名單資料，審核結果將寄到你的註冊 Email。</p>
      <div class="success-list">
        <div><span>目前狀態</span><strong>資料審核中</strong></div>
        <div><span>預計時間</span><strong>1–3 個工作天</strong></div>
        <div><span>註冊贈送</span><strong>200 點行銷簡訊</strong></div>
      </div>
      <a class="button button--primary" href="https://app.lihi.io/admin/login">前往 lihi 登入</a>
    </section>
  </main>

  <footer class="flow-footer">© 2018–2026 利害短網址有限公司 <a href="privacy-policy.html">隱私權政策</a></footer>
</body>
</html>
