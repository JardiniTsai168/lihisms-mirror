<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff5f8">
  <title>建立 lihiSMS 帳號</title>
  <link rel="icon" href="assets/images/favicon-32x32.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="flow-header">
    <div class="flow-header__inner">
      <a class="flow-logo" href="./" aria-label="回到 lihiSMS 首頁"><img src="assets/images/lihisms-logo.png" alt="lihiSMS"></a>
      <a class="header-help" href="https://lihistatus.com/contact">需要協助？聯絡我們</a>
    </div>
  </header>

  <main class="flow-main" id="main">
    <nav class="progress" aria-label="申請進度">
      <ol class="progress__list">
        <li class="progress__item is-current" aria-current="step"><span class="progress__dot">1</span><span class="progress__label">建立帳號</span></li>
        <li class="progress__item"><span class="progress__dot">2</span><span class="progress__label">實名驗證</span></li>
        <li class="progress__item"><span class="progress__dot">3</span><span class="progress__label">白名單網域</span></li>
        <li class="progress__item"><span class="progress__dot">4</span><span class="progress__label">完成申請</span></li>
      </ol>
    </nav>

    <div class="flow-layout">
      <div class="flow-copy">
        <div class="eyebrow">STEP 01</div>
        <h1>建立你的 lihiSMS 帳號</h1>
        <p class="lead">不用信用卡，先完成註冊就能繼續申請簡訊發送資格。</p>
      </div>

      <section class="form-shell" aria-labelledby="register-title">
        <div class="bonus">
          <svg class="bonus__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M7.5 8C5 8 4.5 4 7 4c3 0 5 4 5 4s2-4 5-4c2.5 0 2 4-.5 4"/></svg>
          <span>註冊後送 <strong>200 點行銷簡訊</strong>，讓你免費測試</span>
        </div>
        <div class="form-shell__inner">
          <h2 id="register-title" hidden>註冊帳號</h2>
          <a class="google-button" href="kyc.html" data-demo-next="kyc.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.09-1.92 3.27-4.76 3.27-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.24 1.06-3.71 1.06-2.87 0-5.3-1.94-6.17-4.54H2.15v2.85A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.83 14.09A6.62 6.62 0 0 1 5.48 12c0-.73.13-1.43.35-2.09V7.06H2.15A11 11 0 0 0 1 12c0 1.77.42 3.44 1.15 4.94l3.68-2.85Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.2 1.64l3.15-3.15A10.56 10.56 0 0 0 12 1a11 11 0 0 0-9.85 6.06l3.68 2.85c.87-2.6 3.3-4.53 6.17-4.53Z"/></svg>
            使用 Google 帳號註冊
          </a>
          <div class="divider">或使用 Email 註冊</div>

          <form data-flow-form data-next="kyc.html" data-loading="正在建立帳號…">
            <div class="form-grid form-grid--2">
              <div class="field field--full">
                <label for="name">姓名</label>
                <input id="name" name="name" type="text" autocomplete="name" minlength="2" required aria-describedby="name-error">
                <p class="field__error" id="name-error" aria-live="polite"></p>
              </div>
              <div class="field field--full">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="email-error">
                <p class="field__error" id="email-error" aria-live="polite"></p>
              </div>
              <div class="field">
                <label for="password">密碼</label>
                <div class="password-wrap">
                  <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-error">
                  <button class="password-toggle" type="button" data-password-toggle="password" aria-label="顯示密碼">顯示</button>
                </div>
                <span class="field__hint">至少 8 個字元</span>
                <p class="field__error" id="password-error" aria-live="polite"></p>
              </div>
              <div class="field">
                <label for="password-confirmation">再次輸入密碼</label>
                <div class="password-wrap">
                  <input id="password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-confirmation-error">
                  <button class="password-toggle" type="button" data-password-toggle="password-confirmation" aria-label="顯示密碼">顯示</button>
                </div>
                <span class="field__hint">請輸入相同密碼</span>
                <p class="field__error" id="password-confirmation-error" aria-live="polite"></p>
              </div>
            </div>

            <div class="check-row">
              <input id="terms" name="terms" type="checkbox" required aria-describedby="terms-error">
              <label for="terms">我已閱讀並同意 <a href="terms-of-use.html" target="_blank">服務條款</a> 與 <a href="privacy-policy.html" target="_blank">隱私權政策</a></label>
              <p class="field__error" id="terms-error" aria-live="polite"></p>
            </div>
            <div class="form-actions">
              <a class="button button--secondary" href="./">返回首頁</a>
              <button class="button button--primary" type="submit">建立帳號並繼續</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer class="flow-footer">© 2018–2026 利害短網址有限公司 <a href="privacy-policy.html">隱私權政策</a></footer>
  <script src="onboarding.js" defer></script>
</body>
</html>
